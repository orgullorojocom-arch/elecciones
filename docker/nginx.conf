# Contenedor de la landing: sirve index.html. El color (blue/green) viaja en X-Served-By para verificar qué versión responde.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Served-By "elecciones-${COLOR}" always;
    add_header X-Content-Type-Options nosniff always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /version.txt { default_type text/plain; add_header Cache-Control "no-store" always; }
    location = /index.html { add_header Cache-Control "no-cache" always; add_header X-Served-By "elecciones-${COLOR}" always; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache" always; add_header X-Served-By "elecciones-${COLOR}" always; }
}
