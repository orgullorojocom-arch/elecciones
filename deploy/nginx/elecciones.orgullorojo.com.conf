# Vhost del VPS compartido. Instalación (primera vez, la hace `make vps-setup`):
#   sudo cp deploy/nginx/elecciones.orgullorojo.com.conf /etc/nginx/sites-enabled/elecciones.orgullorojo.com
#   (antes debe existir /etc/nginx/conf.d/elecciones-active-color.conf: lo crea scripts/deploy-bluegreen.sh --first
#    o, para el vhost solo, `make vps-setup`)
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d elecciones.orgullorojo.com   # agrega el 443 + redirect en el archivo instalado
# El upstream "elecciones_front" lo define el include generado por scripts/switch-color.sh.
server {
    listen 80;
    server_name elecciones.orgullorojo.com;
    access_log /var/log/nginx/elecciones.access.log;
    error_log /var/log/nginx/elecciones.error.log;

    location ~* (^/\.(?!well-known)|\.php$|^/wp-|^/xmlrpc\.php) { access_log off; return 444; }

    location / {
        proxy_pass http://elecciones_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
